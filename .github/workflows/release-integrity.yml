name: Release Integrity

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-integrity:
    name: Supply chain / regression / reproducibility
    runs-on: macos-14
    timeout-minutes: 60

    defaults:
      run:
        shell: bash
        working-directory: wam-silent-wallet

    steps:
      - name: Checkout wallet
        uses: actions/checkout@v4
        with:
          path: wam-silent-wallet

      - name: Read locked build identity
        id: lock
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os

          with open(
              "supply-chain.lock.json",
              encoding="utf-8",
          ) as handle:
              data = json.load(handle)

          values = {
              "wsp_commit": (
                  data[
                      "wam_silent_payments"
                  ][
                      "commit"
                  ]
              ),
              "python_version": (
                  data[
                      "python"
                  ][
                      "major_minor"
                  ]
              ),
              "machine": (
                  data[
                      "platform"
                  ][
                      "machine"
                  ]
              ),
          }

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as handle:
              for key, value in values.items():
                  handle.write(
                      f"{key}={value}\n"
                  )

          print(values)
          PY

      - name: Checkout pinned WSP source
        uses: actions/checkout@v4
        with:
          repository: Urriki1502/wam-silent-payments
          ref: ${{ steps.lock.outputs.wsp_commit }}
          path: wam-silent-payments

      - name: Set up locked Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.lock.outputs.python_version }}
          architecture: ${{ steps.lock.outputs.machine }}

      - name: Install hash-locked dependencies
        run: |
          set -euo pipefail

          python --version

          python -m pip install \
              --disable-pip-version-check \
              --require-hashes \
              -r requirements-hashed.txt

          PIP_NO_INDEX=1 \
          python -m pip install \
              --disable-pip-version-check \
              --no-deps \
              --no-build-isolation \
              ../wam-silent-payments

      - name: Verify supply-chain lock
        run: |
          set -euo pipefail

          export PYTHONPATH="$PWD/src:$PWD"

          python scripts/supply_chain.py \
              verify \
              --root . \
              --wsp ../wam-silent-payments \
              --lock supply-chain.lock.json

      - name: Rebuild and verify locked artifacts
        run: |
          set -euo pipefail

          export PYTHONPATH="$PWD/src:$PWD"

          cp artifacts.lock.json \
              "$RUNNER_TEMP/artifacts.lock.expected.json"

          cp requirements-hashed.txt \
              "$RUNNER_TEMP/requirements-hashed.expected.txt"

          cp sbom.cdx.json \
              "$RUNNER_TEMP/sbom.expected.json"

          python scripts/artifact_lock.py \
              build \
              --root . \
              --wsp ../wam-silent-payments

          cmp \
              artifacts.lock.json \
              "$RUNNER_TEMP/artifacts.lock.expected.json"

          cmp \
              requirements-hashed.txt \
              "$RUNNER_TEMP/requirements-hashed.expected.txt"

          cmp \
              sbom.cdx.json \
              "$RUNNER_TEMP/sbom.expected.json"

          python scripts/artifact_lock.py \
              verify \
              --root .

          echo "LOCKED ARTIFACT REBUILD: PASS"

      - name: Full regression
        run: |
          set -euo pipefail

          export PYTHONPATH="$PWD/src:$PWD"

          python -m pytest -q

      - name: Release contamination scan
        run: |
          set -euo pipefail

          export PYTHONPATH="$PWD/src:$PWD"

          python scripts/release_integrity.py \
              --root .

      - name: Independent packaged build A
        run: |
          set -euo pipefail

          PYTHON="$(command -v python)" \
              bash scripts/build_repro_app.sh A

      - name: Independent packaged build B
        run: |
          set -euo pipefail

          PYTHON="$(command -v python)" \
              bash scripts/build_repro_app.sh B

      - name: Compare packaged builds
        run: |
          set -euo pipefail

          export PYTHONPATH="$PWD/src:$PWD"

          python scripts/reproducible_release.py \
              compare \
              --a \
              "$PWD/.repro-build/A/dist/WAM Silent Wallet.app" \
              --b \
              "$PWD/.repro-build/B/dist/WAM Silent Wallet.app" \
              --output \
              .release/reproducibility.json

      - name: Verify repository remains clean
        run: |
          set -euo pipefail

          git diff --check

          DIRTY="$(
              git status \
                  --porcelain \
                  --untracked-files=all
          )"

          if [[ -n "$DIRTY" ]]; then
              echo "REPOSITORY DIRTY AFTER RELEASE GATE"
              echo "$DIRTY"
              exit 1
          fi

          echo "CLEAN REPOSITORY: PASS"

      - name: Generate final provenance
        run: |
          set -euo pipefail

          export PYTHONPATH="$PWD/src:$PWD"

          python scripts/reproducible_release.py \
              provenance \
              --root . \
              --a \
              "$PWD/.repro-build/A/dist/WAM Silent Wallet.app" \
              --b \
              "$PWD/.repro-build/B/dist/WAM Silent Wallet.app" \
              --output \
              .release/release-provenance.json \
              --require-clean

          cat .release/release-provenance.json

      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-integrity-${{ github.sha }}
          if-no-files-found: error
          path: |
            wam-silent-wallet/.release/release-provenance.json
            wam-silent-wallet/.release/reproducibility.json
            wam-silent-wallet/supply-chain.lock.json
            wam-silent-wallet/artifacts.lock.json
            wam-silent-wallet/requirements-hashed.txt
            wam-silent-wallet/sbom.cdx.json
