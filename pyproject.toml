[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wam-silent-wallet"
version = "0.1.0"
description = "Experimental desktop wallet for WAM Silent Payments"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "PySide6==6.11.2"
]

[tool.setuptools.packages.find]
where = ["src"]
