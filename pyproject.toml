[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wam-silent-wallet"
version = "0.1.0"
description = "Experimental desktop wallet for WAM Silent Payments"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "PySide6>=6.11,<7"
]

[tool.setuptools.packages.find]
where = ["src"]
